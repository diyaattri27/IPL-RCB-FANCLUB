<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RCB 2025 Squad</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Back to homepage button styling (similar to schedule page) */
    .back-home {
      display: block;
      width: fit-content;
      margin: 28px auto 60px;
      padding: 10px 18px;
      background: #ff0000;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 700;
      text-align: center;
    }
    .back-home:hover {
      background: #ffcc00;
      color: #000;
    }
  </style>
</head>
<body class="team-bg">
  <!-- Header without navigation -->
  

  <main class="container">
    <section class="section">
     <h2 style="text-align:center; color:#ffcc00; font-size:2rem; margin-bottom:40px;">
  🔥 Meet the 2025 RCB Squad 🔥
</h2>

      <div class="squad-grid" id="squad"></div>
    </section>
  </main>

  <!-- Back to homepage button -->
  <a href="index.html" class="back-home">⬅ Back to Homepage</a>

    <footer class="site-footer">
      <p>© 2025 RCB Fan Club</p>
    </div>
  </footer>

  <script>
    async function loadPlayers() {
      const res = await fetch("players.json");
      const players = await res.json();
      const container = document.getElementById("squad");

      players.forEach(player => {
        const card = document.createElement("div");
        card.className = "player-card";

        card.innerHTML = `
          <img src="${player.image}" alt="${player.name}" class="player-img"/>
          <h3>${player.name}</h3>
          <p class="role">${player.role}</p>
          <p class="bio">${player.bio}</p>

          <h4>Achievements</h4>
          <ul>
            ${player.achievements.map(a => `<li>${a}</li>`).join("")}
          </ul>

          <h4>Best Moments</h4>
          <ul>
            ${player.bestMoments.map(m => `<li>${m}</li>`).join("")}
          </ul>

          <h4>Stats</h4>
          <div class="stats">
            ${Object.entries(player.stats)
              .map(([k,v]) => `<span><strong>${k}:</strong> ${v}</span>`)
              .join("<br/>")}
          </div>
        `;
        container.appendChild(card);
      });
    }
    loadPlayers();
  </script>
</body>
</html>

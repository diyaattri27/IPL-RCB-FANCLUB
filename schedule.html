/* Render helpers */
function changeYear(){
  const yr = document.getElementById('year').value;
  renderYear(yr);
}

function renderYear(year){
  const container = document.getElementById('year-content');
  const data = schedules[year];
  if(!data){
    container.innerHTML = `<p class="note">No data for ${year} yet.</p>`;
    return;
  }

  // season summary
  const s = data.summary;
  let html = `<div class="summary">
      <h2>${year} — Season summary</h2>
      <p><strong>Position:</strong> ${s.position || "—"}</p>
      <p><strong>Matches played:</strong> ${s.played || "—"} &nbsp; <strong>Wins:</strong> ${s.won || 0} &nbsp; <strong>Losses:</strong> ${s.lost || 0} ${s.tied ? "&nbsp; Tied: " + s.tied : ""}</p>
      <p><strong>Points:</strong> ${s.points !== undefined ? s.points : "—"}</p>
      <p>${s.note || ""}</p>
    </div>`;

  // if matches array exists and has entries, show full match table
  if(Array.isArray(data.matches) && data.matches.length){
    html += `<table aria-label="Matches for ${year}">
      <thead>
        <tr>
          <th>Match</th>
          <th>Date</th>
          <th>Opponent</th>
          <th>Venue</th>
          <th>Result</th>
          <th>Margin</th>
          <th>Toss</th>
          <th>Player of Match</th>
        </tr>
      </thead>
      <tbody>`;
    data.matches.forEach(m=>{
      html += `<tr>
        <td>${m.matchNo}</td>
        <td>${m.date}</td>
        <td>${m.opponent}</td>
        <td>${m.venue}</td>
        <td>${m.result}</td>
        <td>${m.margin || "-"}</td>
        <td>${m.toss || "-"}</td>
        <td>${m.playerOfMatch || "-"}</td>
      </tr>`;
    });
    html += `</tbody></table>`;
  } else {
    html += `<p class="note">Full match list for ${year} is not added here. If you want per-match details (scores, venue specifics, individual scorecards) for past seasons, I can expand any year into a full match-by-match list on request.</p>`;
  }

  container.innerHTML = html;
}

/* initial render for default year */
renderYear("2025");
